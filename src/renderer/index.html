<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🎯 每日打卡</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;
  --s0:#1a1a2e;   /* card surface */
  --s1:#252542;   /* elevated surface */
  --s2:#2d2d52;   /* hover surface */
  --bd:#3a3a6a;   /* border */
  --tx:#f0f0f5;   /* main text */
  --mu:#8a8ab0;   /* muted text */
  --p:#fe2c55;    /* 字节红 - primary */
  --p2:#ff6b8a;   /* lighter red */
  --p3:#ff8fa3;   /* accent red */
  --ok:#00d26a;   /* 字节绿 */
  --warn:#ffc107;
  --err:#ff4757;
  --r:16px;       /* larger border radius */
  font-size:15px;
}
body{
  background:linear-gradient(180deg,var(--bg) 0%,#1a1a2e 100%);
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  min-height:100vh;
  padding:20px 16px 80px;
  max-width:500px;
  margin:0 auto;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input{font-family:inherit;color:var(--tx)}

/* ── HEADER ─────────────────────────────────────── */
.hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.hd-l{}
.hd-logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--p3) 0%,var(--p) 50%,#ff1f4b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.3px}
.hd-date{font-size:13px;color:var(--mu);margin-top:4px;font-weight:500}
.hd-btn{background:var(--s0);border:1px solid var(--bd);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hd-btn:hover{border-color:var(--p2);background:var(--s1);transform:translateY(-1px);box-shadow:0 4px 12px rgba(254,44,85,.2)}

/* ── STREAK CARD ─────────────────────────────────── */
.streak-card{
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border:1px solid;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.sk-fire{background:linear-gradient(135deg,#2d1f4a,#3d2a5f);border-color:#6b4ba3;box-shadow:0 8px 24px rgba(107,75,163,.3)}
.sk-ok{background:linear-gradient(135deg,#0a2d1a,#0f4226);border-color:#00a854;box-shadow:0 8px 24px rgba(0,168,84,.3)}
.sk-zero{background:linear-gradient(135deg,#2a1a1a,#3d2525);border-color:#c0392b;box-shadow:0 8px 24px rgba(192,57,43,.25)}
.sk-fresh{background:linear-gradient(135deg,#1a1a2e,#252542);border-color:var(--bd);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.sk-left{display:flex;align-items:center;gap:16px}
.sk-icon{font-size:44px;line-height:1;transition:transform .3s;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.sk-num{
  font-size:56px;
  font-weight:900;
  line-height:1;
  letter-spacing:-3px;
  transition:color .4s;
}
.sk-num.fire{color:#ffc107;text-shadow:0 0 30px rgba(255,193,7,.5)}
.sk-num.ok{color:var(--ok);text-shadow:0 0 30px rgba(0,210,106,.5)}
.sk-num.zero{color:var(--err);text-shadow:0 0 30px rgba(255,71,87,.4)}
.sk-num.fresh{color:var(--mu)}
.sk-unit{font-size:13px;color:var(--mu);margin-top:4px;font-weight:500}
.sk-right{text-align:right}
.sk-chip{
  display:inline-block;
  padding:8px 16px;
  border-radius:24px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.5px;
}
.chip-ok{background:rgba(0,210,106,.15);color:var(--ok);border:1px solid rgba(0,210,106,.3)}
.chip-go{background:rgba(254,44,85,.15);color:var(--p2);border:1px solid rgba(254,44,85,.3)}
.chip-bad{background:rgba(255,71,87,.15);color:var(--err);border:1px solid rgba(255,71,87,.3)}
.chip-fresh{background:var(--s1);color:var(--mu);border:1px solid var(--bd)}
.sk-best{font-size:12px;color:var(--mu);margin-top:8px;font-weight:500}

/* ── PUNISHMENT NOTICE ──────────────────────────── */
.punish{
  background:linear-gradient(135deg,#2a1515,#3d1f1f);
  border:1px solid rgba(255,71,87,.3);
  border-radius:20px;
  padding:16px 20px;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:14px;
  color:#ff8fa3;
  box-shadow:0 4px 16px rgba(255,71,87,.15);
}
.punish-em{font-size:26px;filter:drop-shadow(0 2px 4px rgba(255,71,87,.3))}
.punish-t strong{display:block;margin-bottom:3px;font-size:15px;color:var(--err);font-weight:700}

/* ── SECTION LABEL ──────────────────────────────── */
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;margin-top:6px}
.sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--mu)}
.sec-m{font-size:13px;color:var(--mu);font-weight:500}
.sec-m b{color:var(--p2);font-weight:700}

/* ── TASK CARDS ─────────────────────────────────── */
.tasks{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.tc{
  background:var(--s0);
  border:1px solid var(--bd);
  border-radius:18px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:16px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 16px rgba(0,0,0,.1);
}
.tc:hover{border-color:var(--p2);box-shadow:0 6px 20px rgba(254,44,85,.15);transform:translateY(-2px)}
.tc.done{border-color:rgba(0,210,106,.4);background:linear-gradient(135deg,rgba(0,210,106,.08),var(--s0));box-shadow:0 6px 20px rgba(0,210,106,.15)}

.ring-wrap{position:relative;width:58px;height:58px;flex-shrink:0}
.ring-wrap svg{overflow:visible}
.rb{fill:none;stroke:var(--bd);stroke-width:3.5}
.rp{fill:none;stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .5s ease,stroke .3s}
.rem{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  pointer-events:none;
}

.tc-body{flex:1;min-width:0}
.tc-name{font-size:15px;font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.tc-prog{font-size:13px;margin-bottom:8px;font-weight:600}
.tc-bar{height:4px;background:var(--bd);border-radius:3px;overflow:hidden}
.tc-fill{height:100%;border-radius:3px;transition:width .4s ease}

.tc-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tc-btn{
  width:36px;height:36px;
  border-radius:10px;
  border:1px solid var(--bd);
  background:var(--s1);
  font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);user-select:none;
}
.tc-btn:hover{border-color:var(--p2);background:var(--s2);transform:scale(1.05)}
.tc-btn:active{transform:scale(.92)}
.tc-val{font-size:22px;font-weight:900;min-width:28px;text-align:center;transition:color .2s}

/* ── STATUS BUTTON ──────────────────────────────── */
.sb{
  width:100%;padding:18px;border-radius:18px;
  font-size:15px;font-weight:700;letter-spacing:.5px;
  margin-bottom:28px;border:2px solid transparent;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 16px rgba(0,0,0,.1);
}
.sb.idle{background:var(--s0);border-color:var(--bd);color:var(--mu);cursor:default}
.sb.partial{background:linear-gradient(135deg,#3d2525,#5a3535);border-color:rgba(255,193,7,.5);color:#ffe066;cursor:default;box-shadow:0 4px 16px rgba(255,193,7,.2)}
.sb.win{
  background:linear-gradient(135deg,#0a2d1a,#0f4226);
  border-color:var(--ok);color:var(--ok);cursor:default;
  animation:pulse-ok 2.5s infinite;
  box-shadow:0 8px 24px rgba(0,210,106,.3);
}
@keyframes pulse-ok{0%,100%{box-shadow:0 0 0 0 rgba(0,210,106,.4)}50%{box-shadow:0 0 0 12px rgba(0,210,106,0)}}

/* ── CALENDAR ───────────────────────────────────── */
.cal-wrap{background:var(--s0);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;transition:all .2s}
.cal-nav:hover:not(:disabled){border-color:var(--p2);background:var(--s2);transform:translateY(-1px)}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-mo{font-size:16px;font-weight:700;color:var(--tx)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dw{text-align:center;font-size:11px;color:var(--mu);padding:4px 0 10px;font-weight:600}
.cc{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:13px;border-radius:10px;font-weight:600;
  transition:all .2s;
}
.cc-fut{color:var(--bd)}
.cc-today{border:2px solid var(--p);color:var(--p2);font-weight:800;box-shadow:0 0 12px rgba(254,44,85,.3)}
.cc-p{background:rgba(0,210,106,.15);color:var(--ok);font-size:14px;border:1px solid rgba(0,210,106,.3)}
.cc-pp{background:rgba(255,193,7,.12);color:#ffe066;font-size:14px;border:1px solid rgba(255,193,7,.3)}
.cc-m{background:rgba(255,71,87,.08);color:var(--err);border:1px solid rgba(255,71,87,.2)}
.cal-leg{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu);font-weight:500}
.lg{width:12px;height:12px;border-radius:4px}
.lg-p{background:rgba(0,210,106,.3);border:1px solid rgba(0,210,106,.5)}.lg-pp{background:rgba(255,193,7,.2);border:1px solid rgba(255,193,7,.4)}.lg-m{background:rgba(255,71,87,.15);border:1px solid rgba(255,71,87,.3)}
.lg-t{border:2px solid var(--p);border-radius:4px}

/* ── STATS ──────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--s0);border:1px solid var(--bd);border-radius:18px;padding:16px 12px;text-align:center;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stat:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.stat-v{font-size:30px;font-weight:900;color:var(--p2);line-height:1.2}
.stat-l{font-size:11px;color:var(--mu);margin-top:6px;line-height:1.4;font-weight:500}
.stat.warn .stat-v{color:var(--warn)}
.stat.bad .stat-v{color:var(--err)}
.stat.good .stat-v{color:var(--ok)}

/* ── BADGES ─────────────────────────────────────── */
.badges{background:var(--s0);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:24px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.badge{text-align:center;padding:16px 8px;border-radius:16px;border:1px solid var(--bd);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.badge.e{border-color:rgba(255,193,7,.5);background:linear-gradient(135deg,rgba(255,193,7,.1),rgba(255,193,7,.05));box-shadow:0 4px 12px rgba(255,193,7,.15)}
.badge.e:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(255,193,7,.25)}
.badge.lk{opacity:.3;filter:grayscale(.8)}
.bg-em{font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.bg-n{font-size:13px;font-weight:700;margin-top:8px}
.badge.e .bg-n{color:#ffe066}
.bg-r{font-size:11px;color:var(--mu);margin-top:4px;font-weight:500}

/* ── CONFETTI ────────────────────────────────────── */
@keyframes fall{from{transform:translateY(-30px) rotate(0);opacity:1}to{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* ── MODAL ──────────────────────────────────────── */
.ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.92);z-index:100;
  padding:24px 14px;overflow-y:auto;
  backdrop-filter:blur(8px);
}
.ov.open{display:block}
.modal{background:var(--s0);border:1px solid var(--bd);border-radius:24px;padding:24px;max-width:480px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:800;color:var(--tx)}
.modal-x{
  width:36px;height:36px;border-radius:10px;
  background:var(--s1);border:1px solid var(--bd);
  font-size:18px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.modal-x:hover{border-color:var(--err);color:var(--err);background:rgba(255,71,87,.1);transform:rotate(90deg)}
.msec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--mu);margin-bottom:12px}

.te{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;transition:all .2s}
.te:hover{border-color:var(--p2)}
.te-r{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.te-r:last-child{margin-bottom:0}
.te-lbl{font-size:11px;color:var(--mu);margin-bottom:5px;font-weight:500}
.inp{
  background:var(--s0);border:1px solid var(--bd);border-radius:10px;
  padding:10px 12px;font-size:14px;color:var(--tx);width:100%;outline:none;
  transition:all .2s;
}
.inp:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(254,44,85,.15)}
.inp-n{width:75px;text-align:center}
.inp-u{width:70px}
.em-btn{
  width:44px;height:40px;flex-shrink:0;
  background:var(--s0);border:1px solid var(--bd);border-radius:10px;
  font-size:20px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.em-btn:hover{border-color:var(--p2);transform:scale(1.05)}
.del-btn{
  background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);border-radius:10px;
  padding:10px 14px;color:var(--err);font-size:13px;white-space:nowrap;font-weight:600;
  transition:all .2s;
}
.del-btn:hover{background:rgba(255,71,87,.2);transform:translateY(-1px)}
.add-btn{
  width:100%;border:2px dashed var(--bd);border-radius:16px;
  padding:14px;color:var(--mu);font-size:14px;background:none;font-weight:600;
  margin-bottom:16px;transition:all .2s;
}
.add-btn:hover{border-color:var(--p2);color:var(--p2);background:rgba(254,44,85,.05)}
.save-btn{
  width:100%;background:linear-gradient(135deg,var(--p),#ff1f4b);
  border-radius:16px;padding:16px;color:#fff;font-size:16px;font-weight:700;
  transition:all .2s;box-shadow:0 4px 16px rgba(254,44,85,.3);
}
.save-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(254,44,85,.4)}
.dz{border-top:1px solid var(--bd);margin-top:20px;padding-top:20px}
.reset-btn{
  width:100%;background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);
  border-radius:12px;padding:12px;color:var(--err);font-size:14px;margin-top:10px;font-weight:600;
  transition:all .2s;
}
.reset-btn:hover{background:rgba(255,71,87,.2);transform:translateY(-1px)}

/* ── EMOJI PICKER ───────────────────────────────── */
.ep{
  display:none;position:fixed;
  background:var(--s1);border:1px solid var(--bd);border-radius:16px;
  padding:12px;z-index:300;flex-wrap:wrap;gap:6px;
  width:220px;box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.ep.open{display:flex}
.ep-b{font-size:24px;cursor:pointer;padding:5px;border-radius:8px;border:none;background:none;transition:all .15s}
.ep-b:hover{background:var(--s2);transform:scale(1.15)}

/* ── TOAST ──────────────────────────────────────── */
.toast{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--s1);border:1px solid var(--bd);border-radius:14px;
  padding:12px 24px;font-size:14px;font-weight:600;z-index:400;
  white-space:nowrap;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;
  opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── HEATMAP ────────────────────────────────────── */
.heat-wrap{background:var(--s0);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;justify-content:end;overflow-x:auto;padding-bottom:4px}
.hc{width:11px;height:11px;border-radius:3px;background:var(--s1);border:1px solid rgba(255,255,255,.04)}
.hc.h1{background:rgba(255,193,7,.4);border-color:rgba(255,193,7,.2)}
.hc.h2{background:var(--ok);border-color:rgba(0,210,106,.5)}
.hc.hf{background:#4aa8ff;border-color:rgba(74,168,255,.5)}
.hc.hx{visibility:hidden}

/* ── FREEZE / REPAIR ────────────────────────────── */
.sk-freeze{font-size:12px;color:#7cc4ff;margin-top:8px;font-weight:600}
.repair-btn{
  margin-left:auto;flex-shrink:0;
  background:rgba(74,168,255,.12);border:1px solid rgba(74,168,255,.4);border-radius:10px;
  padding:9px 14px;color:#7cc4ff;font-size:13px;font-weight:700;white-space:nowrap;
  transition:all .2s;
}
.repair-btn:hover{background:rgba(74,168,255,.22);transform:translateY(-1px)}
.cc-f{background:rgba(74,168,255,.15);color:#7cc4ff;border:1px solid rgba(74,168,255,.35)}
.lg-f{background:rgba(74,168,255,.3);border:1px solid rgba(74,168,255,.5)}

/* ── REMINDER ROW ───────────────────────────────── */
.remind-row{display:flex;gap:10px;align-items:center}
.remind-hint{font-size:12px;color:var(--mu);margin-top:8px;font-weight:500}

/* ── BUDDY / SYNC ───────────────────────────────── */
.buddy-code{font-size:26px;font-weight:900;letter-spacing:5px;color:#7cc4ff;text-align:center;padding:12px;background:var(--s1);border:1px dashed rgba(74,168,255,.4);border-radius:12px;margin:6px 0 12px;user-select:all}
.buddy-stat{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--bd);font-size:14px}
.flame{font-size:15px;font-weight:800;text-align:center;padding:14px;border-radius:12px;margin-top:12px}
.flame.on{background:rgba(255,193,7,.12);color:#ffe066;border:1px solid rgba(255,193,7,.35)}
.flame.off{background:rgba(255,71,87,.1);color:var(--err);border:1px solid rgba(255,71,87,.3)}
.sync-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sync-row .save-btn{flex:1}
.sync-meta{font-size:12px;color:var(--mu);margin-top:8px}

/* ── PRODUCT POLISH ───────────────────────────────
   A quieter desktop-product skin layered over the original mobile UI. */
:root{
  --bg:#101214;
  --s0:#181d22;
  --s1:#20262d;
  --s2:#29313a;
  --bd:#313b45;
  --tx:#f6f8fa;
  --mu:#93a1ad;
  --p:#38d6c5;
  --p2:#ff6b7a;
  --p3:#ffbd4a;
  --ok:#35d07f;
  --warn:#ffbd4a;
  --err:#ff5c75;
  --info:#6bb6ff;
  --r:8px;
  font-size:15px;
}
body{
  max-width:560px;
  padding:0 16px 48px;
  background:linear-gradient(180deg,#0f1113 0%,#15191d 48%,#101214 100%);
}
button:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.hd{
  position:sticky;top:0;z-index:40;
  align-items:center;
  margin:0 -16px 16px;
  padding:14px 16px;
  background:rgba(16,18,20,.88);
  border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(16px);
}
.hd-logo{
  font-size:20px;
  color:var(--tx);
  background:none;
  -webkit-text-fill-color:currentColor;
  letter-spacing:0;
}
.hd-date{font-size:12px;color:var(--mu)}
.hd-btn,.cal-nav{
  border-radius:8px;
  background:#161b20;
  border-color:#34404a;
  box-shadow:none;
}
.hd-btn:hover,.cal-nav:hover:not(:disabled){border-color:var(--p);box-shadow:0 8px 24px rgba(56,214,197,.12)}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.ov-item{
  min-width:0;
  padding:12px;
  border:1px solid var(--bd);
  border-radius:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
}
.ov-v{font-size:22px;font-weight:850;line-height:1;color:var(--tx);letter-spacing:0}
.ov-l{margin-top:7px;font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-item:nth-child(1) .ov-v{color:var(--p)}
.ov-item:nth-child(2) .ov-v{color:var(--warn)}
.ov-item:nth-child(3) .ov-v{color:var(--info)}
.streak-card{
  border-radius:8px;
  padding:20px;
  margin-bottom:16px;
  background:linear-gradient(180deg,#1b2026,#171b20);
  border-color:#34404a;
  box-shadow:0 18px 48px rgba(0,0,0,.26);
}
.sk-fire,.sk-ok,.sk-zero,.sk-fresh{background:linear-gradient(180deg,#1b2026,#171b20);box-shadow:0 18px 48px rgba(0,0,0,.26)}
.sk-fire{border-color:rgba(255,189,74,.45)}
.sk-ok{border-color:rgba(53,208,127,.45)}
.sk-zero{border-color:rgba(255,92,117,.42)}
.sk-fresh{border-color:#34404a}
.sk-num{font-size:54px;letter-spacing:0}
.sk-num.fire{color:var(--warn);text-shadow:none}
.sk-num.ok{color:var(--ok);text-shadow:none}
.sk-num.zero{color:var(--err);text-shadow:none}
.sk-chip{border-radius:999px;letter-spacing:0}
.chip-ok{background:rgba(53,208,127,.11);color:var(--ok);border-color:rgba(53,208,127,.28)}
.chip-go{background:rgba(255,189,74,.12);color:var(--warn);border-color:rgba(255,189,74,.3)}
.chip-bad{background:rgba(255,92,117,.12);color:var(--err);border-color:rgba(255,92,117,.3)}
.chip-fresh{background:rgba(147,161,173,.1);color:var(--mu);border-color:#34404a}
.punish,.tc,.cal-wrap,.heat-wrap,.stat,.badges,.te,.modal{border-radius:8px;box-shadow:none}
.tc,.cal-wrap,.heat-wrap,.stat,.badges,.te{background:#181d22;border-color:#313b45}
.tc{padding:16px;gap:14px}
.tc:hover{border-color:rgba(56,214,197,.55);box-shadow:0 12px 28px rgba(0,0,0,.2);transform:translateY(-1px)}
.tc.done{border-color:rgba(53,208,127,.38);background:linear-gradient(180deg,rgba(53,208,127,.08),#181d22)}
.tc-btn,.modal-x,.em-btn,.inp,.del-btn,.reset-btn,.add-btn,.save-btn{border-radius:8px}
.tc-btn{background:#20262d}
.sb{border-radius:8px;margin-bottom:24px;box-shadow:none}
.sb.win{box-shadow:0 0 0 1px rgba(53,208,127,.18),0 12px 32px rgba(53,208,127,.12)}
.sb.partial{background:rgba(255,189,74,.11);border-color:rgba(255,189,74,.36);color:var(--warn)}
.sec{margin-top:8px}
.sec-t{letter-spacing:.9px}
.stat-v{font-size:28px;letter-spacing:0}
.badge{border-radius:8px}
.badge.e{background:linear-gradient(180deg,rgba(255,189,74,.12),rgba(255,189,74,.04));border-color:rgba(255,189,74,.38)}
.badge.e .bg-n{color:var(--warn)}
.buddy-panel{background:linear-gradient(180deg,#15212a,#181d22);border-color:rgba(107,182,255,.32)}
.data-panel{background:linear-gradient(180deg,#1d1b22,#181d22);border-color:#3c4048}
.buddy-code{border-radius:8px;color:var(--info);background:#141b22}
.flame{border-radius:8px}
.toast{border-radius:8px;background:#20262d;border-color:#3b4650}
@media (max-width:460px){
  body{padding-left:12px;padding-right:12px}
  .hd{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  .hd>div:last-child{gap:6px}
  .hd-btn{padding:9px 10px;font-size:12px}
  .overview{grid-template-columns:1fr 1fr}
  .overview .ov-item:last-child{grid-column:1 / -1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .bg-grid{grid-template-columns:repeat(2,1fr)}
  .tc{align-items:flex-start}
  .tc-ctrl{flex-direction:column;gap:6px}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<header class="hd">
  <div class="hd-l">
    <div class="hd-logo" id="hd-logo">🎯 每日打卡</div>
    <div class="hd-date" id="hd-date"></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="hd-btn" id="btn-lang" onclick="toggleLang()">EN</button>
    <button class="hd-btn" id="btn-edit" onclick="openModal()">⚙️ 编辑任务</button>
  </div>
</header>

<div class="overview" id="overview"></div>
<div id="streak-card"></div>
<div id="punish" style="display:none"></div>

<div class="sec">
  <div class="sec-t" id="sec-today"></div>
  <div class="sec-m" id="prog-meta"></div>
</div>
<div class="tasks" id="tasks"></div>
<button class="sb" id="status-btn"></button>

<div class="sec"><div class="sec-t" id="sec-cal"></div></div>
<div class="cal-wrap">
  <div class="cal-hd">
    <button class="cal-nav" id="cal-prev" onclick="prevMo()">◀</button>
    <div class="cal-mo" id="cal-mo"></div>
    <button class="cal-nav" id="cal-next" onclick="nextMo()">▶</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="cal-leg">
    <div class="leg"><div class="lg lg-p"></div><span id="leg-p"></span></div>
    <div class="leg"><div class="lg lg-pp"></div><span id="leg-pp"></span></div>
    <div class="leg"><div class="lg lg-m"></div><span id="leg-m"></span></div>
    <div class="leg"><div class="lg lg-f"></div><span id="leg-f"></span></div>
    <div class="leg"><div class="lg lg-t"></div><span id="leg-t"></span></div>
  </div>
</div>

<!-- 热力图 + 分享卡片 -->
<div class="sec">
  <div class="sec-t" id="sec-heat"></div>
  <button class="cal-nav" id="btn-share" onclick="shareCard()"></button>
</div>
<div class="heat-wrap">
  <div class="heat" id="heat"></div>
</div>

<div class="sec"><div class="sec-t" id="sec-stats"></div></div>
<div class="stats" id="stats"></div>

<div class="badges">
  <div class="sec" style="margin-bottom:0"><div class="sec-t" id="sec-badges"></div></div>
  <div class="bg-grid" id="badges"></div>
</div>

<!-- 打卡搭子 -->
<div class="badges buddy-panel">
  <div class="sec" style="margin-bottom:0"><div class="sec-t" id="sec-buddy"></div></div>
  <div id="buddy-body" style="margin-top:14px"></div>
</div>

<!-- 数据管理 -->
<div class="badges data-panel">
  <div class="sec" style="margin-bottom:0"><div class="sec-t" id="sec-data"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
    <button id="btn-export" onclick="exportData()" style="flex:1;min-width:120px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;color:var(--p2);transition:border-color .2s">📤 导出 JSON</button>
    <button id="btn-import" onclick="importData()" style="flex:1;min-width:120px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;color:var(--p2);transition:border-color .2s">📥 导入 JSON</button>
  </div>
  <div id="sync-body"></div>
</div>

<!-- Modal -->
<div class="ov" id="ov" onclick="ovClick(event)">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-title" id="modal-title">✏️ 编辑任务</div>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="msec" id="msec-list"></div>
    <div id="te-list"></div>
    <button class="add-btn" id="btn-add" onclick="addTE()"></button>
    <button class="save-btn" id="btn-save" onclick="saveEdits()"></button>
    <div class="dz">
      <div class="msec" id="msec-remind"></div>
      <div class="te">
        <div class="remind-row">
          <input class="inp" type="time" id="remind-time" style="width:130px" onchange="setReminder(this.value)">
          <button class="del-btn" id="btn-remind-off" onclick="setReminder('')"></button>
        </div>
        <div class="remind-hint" id="remind-hint"></div>
      </div>
    </div>
    <div class="dz">
      <div class="msec" style="color:var(--err)" id="msec-danger"></div>
      <button class="reset-btn" id="btn-reset" onclick="confirmReset()"></button>
    </div>
  </div>
</div>

<!-- Emoji picker -->
<div class="ep" id="ep"></div>
<div class="toast" id="toast"></div>

<script src="../shared/core.js"></script>
<script src="storage.js"></script>
<script src="renderer.js"></script>
<script src="sync.js"></script>
</body>
</html>
